<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 文件管理系统</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>文件管理系统</h1>
    <p class="login-sub">内部工具 · 请使用预置账号登录</p>
    <form id="login-form">
      <input type="text" id="username" placeholder="账号" autocomplete="username" required>
      <input type="password" id="password" placeholder="密码" autocomplete="current-password" required>
      <div id="login-error" class="login-error" hidden></div>
      <button type="submit" id="login-btn">登 录</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const err = document.getElementById('login-error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = '登录中…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        if (res.ok) { location.href = '/'; return; }
        const data = await res.json().catch(() => ({}));
        err.textContent = data.error || '登录失败，请重试';
        err.hidden = false;
      } catch {
        err.textContent = '网络异常，请检查服务是否可用';
        err.hidden = false;
      } finally {
        btn.disabled = false; btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
