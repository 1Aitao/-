<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件管理系统</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">📁 文件管理系统</div>
  <input type="search" id="search-box" placeholder="搜索全部文件（按名称）">
  <div class="topbar-right">
    <span id="current-user"></span>
    <button id="logout-btn" class="btn ghost">登出</button>
  </div>
</header>

<main class="main">
  <nav class="breadcrumb" id="breadcrumb"></nav>
  <div class="toolbar">
    <button id="btn-upload" class="btn primary">⬆ 上传文件</button>
    <button id="btn-newfolder" class="btn">＋ 新建文件夹</button>
    <input type="file" id="file-input" multiple hidden>
    <span class="toolbar-hint" id="list-hint"></span>
    <div class="sort-group">
      排序：
      <select id="sort-field">
        <option value="updated_at">修改时间</option>
        <option value="name">名称</option>
        <option value="size">大小</option>
      </select>
      <select id="sort-order">
        <option value="desc">降序</option>
        <option value="asc">升序</option>
      </select>
    </div>
  </div>

  <div id="upload-panel" hidden>
    <div class="upload-item" id="upload-item-template">
      <span class="upload-name"></span>
      <span class="upload-status"></span>
    </div>
  </div>

  <table class="file-table">
    <thead>
      <tr>
        <th style="width:50%">名称</th>
        <th style="width:15%" class="col-size">大小</th>
        <th style="width:20%">修改时间</th>
        <th style="width:15%" class="col-ops">操作</th>
      </tr>
    </thead>
    <tbody id="file-tbody"></tbody>
  </table>

  <div id="empty-tip" class="empty-tip" hidden>当前目录为空，点击「上传文件」或「新建文件夹」开始使用</div>
  <div id="search-empty" class="empty-tip" hidden>未找到匹配的文件，换个关键字试试</div>

  <div class="pager">
    <button id="prev-page" class="btn ghost">上一页</button>
    <span id="page-info"></span>
    <button id="next-page" class="btn ghost">下一页</button>
  </div>
</main>

<!-- 重命名弹窗 -->
<dialog id="rename-dialog">
  <form method="dialog">
    <h3 id="rename-title">重命名</h3>
    <input type="text" id="rename-input">
    <div class="dialog-error" id="rename-error" hidden></div>
    <div class="dialog-actions">
      <button value="cancel" class="btn ghost" type="button" id="rename-cancel">取消</button>
      <button value="ok" class="btn primary" id="rename-ok">确定</button>
    </div>
  </form>
</dialog>

<script src="/js/app.js"></script>
</body>
</html>
